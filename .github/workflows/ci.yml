name: ci

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: banking
          POSTGRES_DB: banking
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U banking" --health-interval 5s
          --health-timeout 3s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: banking
      DATABASE_PASSWORD: banking
      DATABASE_NAME: banking
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci_only_secret_not_used_anywhere_else_32
      MIDDLEWARE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run migration:run
      - run: npm test
      - run: npm run test:e2e
